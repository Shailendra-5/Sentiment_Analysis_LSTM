<!DOCTYPE html>
<html>

<head>

<title>
Sentiment Analysis
</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
    text-align:center;
    padding-top:50px;
}


.container{

    background:white;
    width:500px;
    margin:auto;
    padding:30px;
    border-radius:10px;
}


textarea{

    width:90%;
    height:100px;
    padding:10px;
}


button{

    margin-top:20px;
    padding:10px 25px;
    font-size:16px;
    cursor:pointer;
}


.result{

    margin-top:20px;
    font-size:22px;
    font-weight:bold;

}

</style>


</head>


<body>


<div class="container">


<h1>
     Sentiment Analysis
</h1>


<form method="POST">


<textarea
name="sentence"
placeholder="Enter your sentiments..."
>{{sentence}}</textarea>


<br>


<button type="submit">
Predict
</button>


</form>



{% if result %}

<div class="result">

<p>{{result}}</p>

<p>
Confidence: {{probability}} %
</p>

</div>

{% endif %}


</div>


</body>

</html>
